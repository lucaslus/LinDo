[package]
name = "lindo-desktop"
version = "1.1.4"
description = "Lindo — Native-Grade High-Performance Linux.do Desktop Client"
authors = ["Lindo Community"]
edition = "2021"

[lib]
name = "lindo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
cc = "1.2"

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
futures-util = "0.3"
sha2 = "0.10"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
cookie = "0.18"
url = "2.5"
base64 = "0.22"
dirs = "6.0"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
lindo_ech = { path = "../../native-ech" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
