[package]
name = "lindo_ech"
version = "0.1.0"
edition = "2021"

[lib]
name = "lindo_ech"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
boring2 = "5.0.0-alpha.13"
brotli-decompressor = "5"
bytes = "1.12"
http = "1"
http-body-util = "0.1.5"
hyper = { version = "1.11", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "http1", "http2", "server", "server-auto", "service"] }
jni = "0.21"
parking_lot = "0.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-boring2 = "5.0.0-alpha.13"
webpki-root-certs = "1.0"

[dev-dependencies]
boring-sys2 = "5.0.0-alpha.13"
foreign-types = "0.5"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.release.build-override]
strip = false
