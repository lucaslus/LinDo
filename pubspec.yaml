name: lindo
description: "Lindo — High-Performance Native Linux.do Client for Android, macOS, and Windows"
publish_to: 'none'
version: 0.3.0+35

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  http: ^1.3.0
  html: ^0.15.5
  markdown: ^7.3.0
  crypto: ^3.0.6
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/brand/
    - assets/vectors/brand/
    - assets/vectors/expressions/
    - assets/vectors/badges/
    - assets/desktop/
