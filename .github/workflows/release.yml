name: Release All Platforms (macOS Tauri + Windows Tauri + Android APK)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Target GitHub Release tag (e.g. v1.1.0). Leave empty for dry-run artifact build only."
        required: false
        type: string
      prerelease:
        description: "Mark GitHub Release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Tauri (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x64
            rust_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: desktop-tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-tauri/src-tauri -> target"
          key: macos-${{ matrix.arch }}

      - uses: astral-sh/setup-uv@v5

      - name: Install frontend dependencies & verify TypeScript
        working-directory: desktop-tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit

      - name: Run Rust unit tests (arm64 host)
        if: matrix.arch == 'arm64'
        working-directory: desktop-tauri/src-tauri
        run: cargo test --lib

      - name: Build Lindo.app (${{ matrix.arch }})
        working-directory: desktop-tauri
        run: |
          pnpm tauri build --target ${{ matrix.rust_target }} --bundles app

      - name: Package ad-hoc signed .zip (in-app updater) & .dmg (installer)
        working-directory: desktop-tauri
        run: |
          VER=$(node -p "require('./package.json').version")
          APP_PATH="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Lindo.app"
          codesign --force --deep --sign - "$APP_PATH"

          mkdir -p dist-release
          ZIP_OUT="dist-release/Lindo-${VER}-macos-${{ matrix.arch }}.zip"
          DMG_OUT="dist-release/Lindo-${VER}-macos-${{ matrix.arch }}.dmg"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_OUT"
          uv run --with dmgbuild,pillow python3 ../scripts/build_macos_dmg.py \
            --app "$APP_PATH" \
            --icon src-tauri/icons/icon.icns \
            --mark ../design/brand-v3/sources/mark-transparent.png \
            --out "$DMG_OUT"
          ls -lh dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: desktop-tauri/dist-release/*

  build-windows:
    name: Windows Tauri (x64 NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: desktop-tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-tauri/src-tauri -> target"
          key: windows-x64

      - name: Install frontend dependencies & verify TypeScript
        working-directory: desktop-tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit

      - name: Run Windows Rust unit tests (RSA + Release Asset Parser)
        working-directory: desktop-tauri/src-tauri
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if (Test-Path "C:\Program Files\NASM") {
              $env:PATH += ";C:\Program Files\NASM"
              "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          cargo test --lib

      - name: Build Windows NSIS (-setup.exe) & MSI installers
        working-directory: desktop-tauri
        run: pnpm tauri build --bundles nsis,msi

      - name: Collect canonical Windows release assets
        working-directory: desktop-tauri
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null

          $nsisExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $nsisExe) {
            $nsisExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          }
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "dist-release/Lindo-$ver-windows-x64-setup.exe" -Force
          }

          $msiPkg = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msiPkg) {
            Copy-Item $msiPkg.FullName "dist-release/Lindo-$ver-windows-x64.msi" -Force
          }

          Get-ChildItem dist-release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: desktop-tauri/dist-release/*

  build-android:
    name: Android APK (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify cross-platform version manifest consistency
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_FULL: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VER=$(python3 -c "import json; print(json.load(open('desktop-tauri/package.json'))['version'])")
          TAURI_VER=$(python3 -c "import json; print(json.load(open('desktop-tauri/src-tauri/tauri.conf.json'))['version'])")
          CARGO_VER=$(grep -E '^version = "' desktop-tauri/src-tauri/Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          DIAG_VER=$(grep -E 'DESKTOP_APP_VERSION = "' desktop-tauri/src/lib/diagnostics.ts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          GRADLE_VER=$(grep -E 'versionName = "' composeApp/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          GRADLE_CODE=$(grep -E 'versionCode = ' composeApp/build.gradle.kts | head -n1 | sed -E 's/.*= *([0-9]+).*/\1/')
          KT_VER=$(grep -E 'DEFAULT_APP_VERSION_NAME: String = "' composeApp/src/commonMain/kotlin/do_/linux/lindo/core/diagnostics/LinDoDiagnosticLogger.kt | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          KT_CODE=$(grep -E 'DEFAULT_APP_BUILD: Int = ' composeApp/src/commonMain/kotlin/do_/linux/lindo/core/diagnostics/LinDoDiagnosticLogger.kt | head -n1 | sed -E 's/.*= *([0-9]+).*/\1/')

          echo "Manifest versions: pkg=$PKG_VER tauri=$TAURI_VER cargo=$CARGO_VER diag=$DIAG_VER gradle=$GRADLE_VER(code=$GRADLE_CODE) kt=$KT_VER(code=$KT_CODE)"
          for v in "$TAURI_VER" "$CARGO_VER" "$DIAG_VER" "$GRADLE_VER" "$KT_VER"; do
            if [ "$v" != "$PKG_VER" ]; then
              echo "ERROR: Version mismatch detected across manifests ($v != $PKG_VER)" >&2
              exit 1
            fi
          done
          if [ "$GRADLE_CODE" != "$KT_CODE" ]; then
            echo "ERROR: Android versionCode ($GRADLE_CODE) != DEFAULT_APP_BUILD ($KT_CODE)" >&2
            exit 1
          fi

          EXPECTED_TAG=""
          if [ -n "$INPUT_TAG" ]; then
            EXPECTED_TAG="$INPUT_TAG"
          elif [[ "$REF_FULL" == refs/tags/v* ]]; then
            EXPECTED_TAG="$REF_NAME"
          fi
          if [ -n "$EXPECTED_TAG" ]; then
            CLEAN_TAG="${EXPECTED_TAG#v}"
            CLEAN_TAG="${CLEAN_TAG#V}"
            if [ "$CLEAN_TAG" != "$PKG_VER" ]; then
              echo "ERROR: Release tag ($EXPECTED_TAG -> $CLEAN_TAG) does not match manifest version ($PKG_VER)" >&2
              exit 1
            fi
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Ninja & CMake for BoringSSL Android NDK build
        run: |
          if ! command -v ninja >/dev/null 2>&1 || ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ninja-build cmake
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native-ech -> target"
          key: android-ech-arm64

      - name: Build Android ECH native library (arm64-v8a) from Rust source
        run: ./scripts/build_android_ech.sh --arm64-only

      - name: Restore consistent debug/release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_FULL: ${{ github.ref }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            KS_PATH="${RUNNER_TEMP}/lindo-release.keystore"
            echo "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
            chmod 600 "$KS_PATH"
            mkdir -p "$HOME/.android" "${XDG_CONFIG_HOME:-$HOME/.config}/.android"
            cp -f "$KS_PATH" "$HOME/.android/debug.keystore"
            cp -f "$KS_PATH" "${XDG_CONFIG_HOME:-$HOME/.config}/.android/debug.keystore"
            keytool -list -keystore "$KS_PATH" -storepass android -alias androiddebugkey >/dev/null
            echo "LINDO_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          elif [[ "$REF_FULL" == refs/tags/v* ]] || [ -n "$INPUT_TAG" ]; then
            echo "ERROR: ANDROID_DEBUG_KEYSTORE_BASE64 secret is required for official Release builds so future in-app updates preserve APK signature compatibility." >&2
            exit 1
          fi

      - name: Build Android Release APK & verify certificate match
        run: |
          ./gradlew :composeApp:assembleRelease --no-daemon --console=plain
          VER_NAME=$(grep -E 'versionName = "' composeApp/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VER_CODE=$(grep -E 'versionCode = ' composeApp/build.gradle.kts | head -n1 | sed -E 's/.*= *([0-9]+).*/\1/')
          mkdir -p dist-android
          APK_SRC=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -n "${LINDO_KEYSTORE_PATH:-}" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            APKSIGNER_BIN=$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)
            EXPECTED_SHA=$(keytool -list -v -keystore "$LINDO_KEYSTORE_PATH" -storepass android -alias androiddebugkey | grep -E 'SHA256:' | head -n1 | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
            ACTUAL_SHA=$("$APKSIGNER_BIN" verify --print-certs "$APK_SRC" | grep -E 'Signer #1 certificate SHA-256 digest:' | head -n1 | awk -F': ' '{print $2}' | tr -d '[:space:]' | tr 'A-F' 'a-f')
            echo "APK v2 signing SHA256: actual=$ACTUAL_SHA expected=$EXPECTED_SHA"
            if [ -z "$ACTUAL_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERROR: APK certificate SHA256 ($ACTUAL_SHA) does not match keystore ($EXPECTED_SHA)!" >&2
              exit 1
            fi
          fi
          cp "$APK_SRC" "dist-android/lindo-${VER_NAME}-build${VER_CODE}.apk"
          ls -lh dist-android/

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: dist-android/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-android]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt & upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          IS_PRE: ${{ github.event.inputs.prerelease }}
        run: |
          TARGET_TAG="${INPUT_TAG:-$REF_NAME}"
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -Fxv "$TARGET_TAG" | head -n1 || true)
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" \
              | grep -Ev '^- chore\(release\):' \
              | head -n 8 > "$NOTES_FILE" || true
          else
            git log -n 6 --no-merges --pretty=format:"- %s" \
              | grep -Ev '^- chore\(release\):' > "$NOTES_FILE" || true
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "- 常规体验优化与问题修复" > "$NOTES_FILE"
          fi

          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt ./SHA256SUMS.txt
          cat SHA256SUMS.txt

          PRE_FLAG=""
          if [ "$IS_PRE" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi

          if ! gh release view "$TARGET_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TARGET_TAG" * \
              --repo "$REPO" \
              --title "Lindo ${TARGET_TAG}" \
              --notes-file "$NOTES_FILE" \
              $PRE_FLAG
          else
            gh release upload "$TARGET_TAG" * --repo "$REPO" --clobber
          fi
