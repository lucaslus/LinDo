name: Verify & Package Windows Desktop (Tests + MSI)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing GitHub Release tag to upload Windows MSI to (e.g. v0.3.0-draft)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-package-windows:
    name: Windows Tests & MSI Installer (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Ensure WiX Toolset v3 is available
        shell: pwsh
        run: |
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          )
          if ($env:WIX) {
            $wixPaths = @((Join-Path $env:WIX "bin")) + $wixPaths
          }
          $found = $wixPaths | Where-Object { Test-Path "$_\light.exe" } | Select-Object -First 1
          if (-not $found) {
            Write-Host "Installing WiX Toolset 3.14.1 via Chocolatey..."
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $found = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          }
          Write-Host "Using WiX bin: $found"
          echo "$found" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Flutter dependencies
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Run Flutter unit & widget test suite
        shell: pwsh
        run: flutter test

      - name: Build Native Windows Release & Package MSI
        id: pkg
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          GITHUB_REF_FULL: ${{ github.ref }}
          GITHUB_REF_SHORT: ${{ github.ref_name }}
        run: |
          Remove-Item -Recurse -Force build/windows -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

          flutter build windows --release

          $exe = Get-Item "build/windows/x64/runner/Release/Lindo.exe"
          Write-Host "Built Windows executable: $($exe.FullName) ($([math]::Round($exe.Length / 1KB, 1)) KB)"

          $pubspecMatch = Select-String -Path "pubspec.yaml" -Pattern '^version:\s*([^\s+]+)' | Select-Object -First 1
          $pubspecVer = if ($pubspecMatch) { $pubspecMatch.Matches[0].Groups[1].Value.Trim() } else { "0.3.0" }

          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_TAG)) {
            $version = ($env:INPUT_RELEASE_TAG -replace '^v', '').Trim()
          } elseif ($env:GITHUB_REF_FULL -like 'refs/tags/*') {
            $version = ($env:GITHUB_REF_SHORT -replace '^v', '').Trim()
          } else {
            $version = $pubspecVer
          }

          $outMsi = "dist/lindo-$version-windows-x64.msi"
          pwsh -File scripts/build_windows_msi.ps1 `
            -Version "$version" `
            -ReleaseDir "build/windows/x64/runner/Release" `
            -OutFile "$outMsi"

          Get-ChildItem "dist/" | Format-Table Name, Length
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "msi_path=$outMsi" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows MSI Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindo-windows-x64-msi
          path: ${{ steps.pkg.outputs.msi_path }}

      - name: Attach Windows MSI to GitHub Release
        if: ${{ github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          MSI_PATH: ${{ steps.pkg.outputs.msi_path }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "$env:TARGET_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            if ($env:TARGET_TAG -like '*-*') {
              gh release create "$env:TARGET_TAG" --prerelease --title "$env:TARGET_TAG" --notes "Automated build for $env:TARGET_TAG"
            } else {
              gh release create "$env:TARGET_TAG" --title "$env:TARGET_TAG" --notes "Automated build for $env:TARGET_TAG"
            }
          }
          $PSNativeCommandUseErrorActionPreference = $true
          gh release upload "$env:TARGET_TAG" "$env:MSI_PATH" --clobber
