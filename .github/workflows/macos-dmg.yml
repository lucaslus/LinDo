name: Build macOS DMG (Apple Silicon arm64 & Intel x64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing GitHub Release tag to upload DMG assets to (e.g. v0.2.27-draft)"
        required: false
        type: string
      arch_filter:
        description: "Architectures to build: all, arm64, or x64"
        required: false
        default: "all"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    if: ${{ (github.event.inputs.arch_filter || 'all') == 'all' || github.event.inputs.arch_filter == matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (${{ matrix.arch }})
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build native Lindo.app (${{ matrix.arch }})
        run: ./gradlew :composeApp:createDistributable --no-daemon --console=plain

      - name: Package Best-Practice Drag-to-Applications DMG (${{ matrix.arch }})
        run: |
          VERSION=$(grep -E 'versionName = "' composeApp/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_NAME="${{ github.event.inputs.release_tag || github.ref_name }}"
          CLEAN_TAG="${TAG_NAME#v}"
          OUT_NAME="lindo-${CLEAN_TAG:-$VERSION}-macos-${{ matrix.arch }}.dmg"
          uv run --with dmgbuild,pillow python3 scripts/build_macos_dmg.py \
            --app composeApp/build/compose/binaries/main/app/Lindo.app \
            --icon composeApp/src/desktopMain/resources/icon.icns \
            --mark design/brand-v3/sources/mark-transparent.png \
            --out "composeApp/build/compose/binaries/main/dmg/${OUT_NAME}"
          ls -lh "composeApp/build/compose/binaries/main/dmg/${OUT_NAME}"

      - name: Upload DMG artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: lindo-macos-${{ matrix.arch }}-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg

      - name: Attach DMG to GitHub Release (if release tag provided)
        if: ${{ github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          gh release upload "${TARGET_TAG}" composeApp/build/compose/binaries/main/dmg/*.dmg --clobber
