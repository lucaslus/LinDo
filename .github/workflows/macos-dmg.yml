name: Build macOS DMG (Apple Silicon arm64 & Intel x64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing GitHub Release tag to upload DMG assets to (e.g. v0.3.0-draft)"
        required: false
        type: string
      arch_filter:
        description: "Architectures to build: all, arm64, or x64"
        required: false
        default: "all"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS DMG (Apple Silicon arm64)
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.arch_filter || 'all') == 'all' || github.event.inputs.arch_filter == 'arm64' }}
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Flutter dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Run Flutter unit & widget test suite (arm64)
        run: flutter test

      - name: Build native Lindo.app (arm64)
        run: |
          rm -rf build/macos dist
          flutter build macos --release
          test -d build/macos/Build/Products/Release/Lindo.app
          codesign --force --deep --sign - build/macos/Build/Products/Release/Lindo.app
          codesign --verify --deep --strict build/macos/Build/Products/Release/Lindo.app

      - name: Package Drag-to-Applications DMG (arm64)
        id: pkg
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          GITHUB_REF_FULL: ${{ github.ref }}
          GITHUB_REF_SHORT: ${{ github.ref_name }}
        run: |
          PUBSPEC_VER=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)
          if [ -n "${INPUT_RELEASE_TAG}" ]; then
            VERSION="${INPUT_RELEASE_TAG#v}"
          elif [[ "${GITHUB_REF_FULL}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_SHORT#v}"
          else
            VERSION="${PUBSPEC_VER:-0.3.0}"
          fi
          mkdir -p dist
          OUT_DMG="dist/lindo-${VERSION}-macos-arm64.dmg"
          uv run --with dmgbuild,pillow python3 scripts/build_macos_dmg.py \
            --app build/macos/Build/Products/Release/Lindo.app \
            --icon assets/desktop/icon.icns \
            --mark design/brand-v3/sources/mark-transparent.png \
            --out "${OUT_DMG}"
          ls -lh "${OUT_DMG}"
          echo "dmg_path=${OUT_DMG}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS arm64 DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindo-macos-arm64-dmg
          path: ${{ steps.pkg.outputs.dmg_path }}

      - name: Attach arm64 DMG to GitHub Release
        if: ${{ github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          DMG_PATH: ${{ steps.pkg.outputs.dmg_path }}
        run: |
          PRERELEASE_ARGS=()
          if [[ "${TARGET_TAG}" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release view "${TARGET_TAG}" >/dev/null 2>&1 || \
            gh release create "${TARGET_TAG}" "${PRERELEASE_ARGS[@]}" --title "${TARGET_TAG}" --notes "Automated build for ${TARGET_TAG}" || \
            gh release view "${TARGET_TAG}" >/dev/null 2>&1
          gh release upload "${TARGET_TAG}" "${DMG_PATH}" --clobber

  build-macos-x64:
    name: Build macOS DMG (Intel x64)
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.arch_filter || 'all') == 'all' || github.event.inputs.arch_filter == 'x64' }}
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Flutter dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Run Flutter unit & widget test suite (x64)
        run: flutter test

      - name: Build native Lindo.app (x64)
        run: |
          rm -rf build/macos dist
          flutter build macos --release
          test -d build/macos/Build/Products/Release/Lindo.app
          codesign --force --deep --sign - build/macos/Build/Products/Release/Lindo.app
          codesign --verify --deep --strict build/macos/Build/Products/Release/Lindo.app

      - name: Package Drag-to-Applications DMG (x64)
        id: pkg
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          GITHUB_REF_FULL: ${{ github.ref }}
          GITHUB_REF_SHORT: ${{ github.ref_name }}
        run: |
          PUBSPEC_VER=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)
          if [ -n "${INPUT_RELEASE_TAG}" ]; then
            VERSION="${INPUT_RELEASE_TAG#v}"
          elif [[ "${GITHUB_REF_FULL}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_SHORT#v}"
          else
            VERSION="${PUBSPEC_VER:-0.3.0}"
          fi
          mkdir -p dist
          OUT_DMG="dist/lindo-${VERSION}-macos-x64.dmg"
          uv run --with dmgbuild,pillow python3 scripts/build_macos_dmg.py \
            --app build/macos/Build/Products/Release/Lindo.app \
            --icon assets/desktop/icon.icns \
            --mark design/brand-v3/sources/mark-transparent.png \
            --out "${OUT_DMG}"
          ls -lh "${OUT_DMG}"
          echo "dmg_path=${OUT_DMG}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS x64 DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindo-macos-x64-dmg
          path: ${{ steps.pkg.outputs.dmg_path }}

      - name: Attach x64 DMG to GitHub Release
        if: ${{ github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          DMG_PATH: ${{ steps.pkg.outputs.dmg_path }}
        run: |
          PRERELEASE_ARGS=()
          if [[ "${TARGET_TAG}" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release view "${TARGET_TAG}" >/dev/null 2>&1 || \
            gh release create "${TARGET_TAG}" "${PRERELEASE_ARGS[@]}" --title "${TARGET_TAG}" --notes "Automated build for ${TARGET_TAG}" || \
            gh release view "${TARGET_TAG}" >/dev/null 2>&1
          gh release upload "${TARGET_TAG}" "${DMG_PATH}" --clobber
