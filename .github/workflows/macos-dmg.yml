name: Build macOS DMG (Apple Silicon arm64 & Intel x64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing GitHub Release tag to upload DMG assets to (e.g. v0.2.27-draft)"
        required: false
        type: string
      arch_filter:
        description: "Architectures to build: all, arm64, or x64"
        required: false
        default: "all"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS DMG (Apple Silicon arm64)
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.arch_filter || 'all') == 'all' || inputs.arch_filter == 'arm64' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: astral-sh/setup-uv@v5
      - name: Build native Lindo.app (arm64)
        run: ./gradlew :composeApp:createDistributable --no-daemon --console=plain
      - name: Package Drag-to-Applications DMG (arm64)
        run: |
          VERSION=$(grep -E 'versionName = "' composeApp/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_NAME="${{ inputs.release_tag || github.ref_name }}"
          CLEAN_TAG="${TAG_NAME#v}"
          OUT_NAME="lindo-${CLEAN_TAG:-$VERSION}-macos-arm64.dmg"
          uv run --with dmgbuild,pillow python3 scripts/build_macos_dmg.py \
            --app composeApp/build/compose/binaries/main/app/Lindo.app \
            --icon composeApp/src/desktopMain/resources/icon.icns \
            --mark design/brand-v3/sources/mark-transparent.png \
            --out "composeApp/build/compose/binaries/main/dmg/${OUT_NAME}"
          ls -lh "composeApp/build/compose/binaries/main/dmg/${OUT_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: lindo-macos-arm64-dmg
          path: composeApp/build/compose/binaries/main/dmg/*arm64.dmg
      - name: Attach arm64 DMG to GitHub Release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.release_tag || github.ref_name }}"
          gh release upload "${TARGET_TAG}" composeApp/build/compose/binaries/main/dmg/*arm64.dmg --clobber

  build-macos-x64:
    name: Build macOS DMG (Intel x64)
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.arch_filter || 'all') == 'all' || inputs.arch_filter == 'x64' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: astral-sh/setup-uv@v5
      - name: Build native Lindo.app (x64)
        run: ./gradlew :composeApp:createDistributable --no-daemon --console=plain
      - name: Package Drag-to-Applications DMG (x64)
        run: |
          VERSION=$(grep -E 'versionName = "' composeApp/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_NAME="${{ inputs.release_tag || github.ref_name }}"
          CLEAN_TAG="${TAG_NAME#v}"
          OUT_NAME="lindo-${CLEAN_TAG:-$VERSION}-macos-x64.dmg"
          uv run --with dmgbuild,pillow python3 scripts/build_macos_dmg.py \
            --app composeApp/build/compose/binaries/main/app/Lindo.app \
            --icon composeApp/src/desktopMain/resources/icon.icns \
            --mark design/brand-v3/sources/mark-transparent.png \
            --out "composeApp/build/compose/binaries/main/dmg/${OUT_NAME}"
          ls -lh "composeApp/build/compose/binaries/main/dmg/${OUT_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: lindo-macos-x64-dmg
          path: composeApp/build/compose/binaries/main/dmg/*x64.dmg
      - name: Attach x64 DMG to GitHub Release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.release_tag || github.ref_name }}"
          gh release upload "${TARGET_TAG}" composeApp/build/compose/binaries/main/dmg/*x64.dmg --clobber
